<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | W.R.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="nav-logo"><i class="fa-solid fa-shield-cat"></i> W.R.S.</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/services/">Services</a>
            <a href="/contact/" class="active">Contact</a>
        </div>
    </nav>
    <header class="hero">
        <h1>Secure <span class="highlight">Intake</span></h1>
        <p>Submit your operational requirements below.</p>
    </header>
    <section class="services">
        <!-- Be sure your Formspree ID is updated in the action URL -->
        <form action="https://formspree.io/f/mgaeooll" method="POST" class="secure-form">
            <div class="form-group">
                <label>Identifier (Name)</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Comms Routing (Email)</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Operational Domain</label>
                <select name="service" class="form-control" required>
                    <option value="" disabled selected>Select an objective...</option>
                    <option value="Hardware">Hardware Repair / Fabrication</option>
                    <option value="Data">Data Recovery</option>
                    <option value="Infosec">InfoSec Audit / Pentest</option>
                    <option value="Other">Other Protocol</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mission Brief (Details)</label>
                <textarea name="message" class="form-control" required></textarea>
            </div>
            <div class="cf-turnstile" data-sitekey="YOUR_CLOUDFLARE_SITEKEY"></div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Transmit Payload</button>
        </form>
    </section>
</body>
</html>
