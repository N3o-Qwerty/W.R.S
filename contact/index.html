<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com;">
    <title>GET SECURE | White Rabbit Security</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <nav class="main-nav"><a href="/">[ Home ]</a> <a href="/services/">[ Explore Services ]</a></nav>
    <main class="contact-container">
        <header class="section-header">
            <h1>Initiate Contact</h1>
            <p>Provide details about your hardware, data, or security requirements. Communications are strictly confidential.</p>
        </header>
        <form action="https://formspree.io/f/mgaeooll" method="POST" class="secure-form">
            <div class="form-group"><label>Alias / Name *</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Secure Email or Phone *</label><input type="text" name="contact" required></div>
            <div class="form-group">
                <label>Required Service *</label>
                <select name="service-type" required>
                    <option value="">-- Select Objective --</option>
                    <option value="hardware-repair">Hardware Repair & Fabrication</option>
                    <option value="data-recovery">Data Recovery</option>
                    <option value="infosec-audit">Offensive Security Audit</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group"><label>System Details & Objectives *</label><textarea name="details" rows="6" required></textarea></div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEiZO1HFW-StlVeR"></div>
            <button type="submit" class="submit-btn">TRANSMIT REQUEST</button>
        </form>
    </main>
</body>
</html>
